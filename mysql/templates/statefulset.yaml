apiVersion: apps/v1 
kind: StatefulSet
metadata:
  name: mysql
  namespace: roboshop
spec:
  replicas: {{ .Values.statefulset.replicas }}
  serviceName: mysql-headless
  selector:
    matchLabels:
      project: roboshop
      component: mysql 
      tier: db 
  template:
    metadata:
      labels:
        project: roboshop
        component: mysql 
        tier: db 
    spec:
      containers:
      - name: mysql
        image: {{ .Values.statefulset.image_URL }}:{{ .Values.statefulset.imageVersion }}
        envFrom:
          - configMapRef:
              name: mysql-config
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql 
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "ebs-sc"
      resources:
        requests:
          storage: 2Gi