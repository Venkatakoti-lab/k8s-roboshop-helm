apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart
  namespace: roboshop
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      project: roboshop
      component: cart 
      tier: app 
  template:
    metadata:
      labels:
        project: roboshop
        component: cart
        tier: app 
    spec:
      containers:
      - name: cart
        image: {{ .Values.deployment.image_URL}}:{{ .Values.deployment.imageVersion }}
        envFrom:
          - configMapRef:
              name: cart-cm 
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"