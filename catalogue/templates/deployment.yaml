apiVersion: apps/v1
kind: Deployment 
metadata:
  name: catalogue 
  namespace: roboshop
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      project: roboshop
      component: catalogue 
      tier: app 
  template:
    metadata:
      labels:
        project: roboshop
        component: catalogue 
        tier: app 
    spec:
      containers:
      - name: catalogue 
        image: "{{ .Values.deployment.image_URL }}:{{ .Values.deployment.imageVersion }}"
        envFrom:
          - configMapRef:
              name: catalogue-cm
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
