apiVersion: apps/v1
kind: Deployment 
metadata:
  name: user 
  namespace: roboshop
spec:
  replicas: {{ .Values.delpoyment.replicas }}
  selector:
    matchLabels:
      project: roboshop
      component: user
      tier: app 
  template:
    metadata:
      labels:
        project: roboshop
        component: user 
        tier: app 
    spec:
      containers:
      - name: user 
        image: {{ .Values.deployment.image_URL }}:{{ .Values.deployment.imageVersion }}
        envFrom:
          - configMapRef:
              name: user-cm
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"